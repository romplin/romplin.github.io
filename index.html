<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>romplin-labs</title>
    <script src="https://unpkg.com/htmx.org@2.0.3"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            line-height: 1.5;
            color: #fff;
            background: #2a2a2a;
            font-size: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .hero {
            max-width: 900px;
            width: 100%;
            text-align: center;
            margin-bottom: 30px;
        }

        .hero .logo-placeholder {
            width: 120px;
            height: 120px;
            margin: 0 auto 10px;
        }

        .hero .logo-placeholder img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .hero h1 {
            font-size: 2.5em;
            margin-bottom: 0.2em;
            color: #22c55e;
            letter-spacing: -1px;
        }

        .hero .tagline {
            font-size: 0.8em;
            color: #ccc;
            margin-bottom: 1.5em;
        }

        .content-wrapper {
            max-width: 900px;
            width: 100%;
        }

        .contact-section {
            background: #1a1a1a;
            padding: 30px;
            border-radius: 8px;
            border: 1px solid #3a3a3a;
        }

        .contact-section h2 {
            color: #22c55e;
            text-align: center;
            margin-bottom: 1.2em;
            font-size: 1.6em;
        }

        .contact-form {
            max-width: 500px;
            margin: 0 auto;
        }

        .form-group {
            margin-bottom: 1rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.4rem;
            font-weight: 500;
            color: #22c55e;
            font-size: 0.95em;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 10px;
            background: #2a2a2a;
            border: 1px solid #3a3a3a;
            border-radius: 6px;
            color: #fff;
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #22c55e;
        }

        .form-group input::placeholder,
        .form-group textarea::placeholder {
            color: #666;
        }

        .submit-btn {
            width: 100%;
            padding: 12px;
            background: #22c55e;
            color: #1a1a1a;
            border: none;
            border-radius: 6px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            font-family: 'Inter', sans-serif;
        }

        .submit-btn:hover {
            background: #16a34a;
            transform: translateY(-2px);
        }

        .form-message {
            margin-top: 1rem;
            padding: 12px;
            border-radius: 6px;
            text-align: center;
            background: #dcfce7;
            color: #166534;
            border: 1px solid #22c55e;
        }

        footer {
            text-align: center;
            padding: 20px;
            color: #666;
            margin-top: 1.5em;
            font-size: 0.9em;
        }

        footer a {
            color: #22c55e;
            text-decoration: none;
        }

        footer a:hover {
            text-decoration: underline;
        }

        @media (max-width: 768px) {
            .hero h1 {
                font-size: 2em;
            }

            .contact-section {
                padding: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="content-wrapper">
        <div class="hero">
            <div class="logo-placeholder">
                <img src="/static/images/logo.png" alt="romplin-labs logo">
            </div>
            <h1>romplin-labs</h1>
            <div class="tagline">simple productive software</div>
        </div>

        <section class="contact-section">
            <h2>let's work together</h2>
            <form class="contact-form" 
                  action="https://formspree.io/f/mnngbzop"
                  method="POST">
                <div class="form-group">
                    <label for="name">name</label>
                    <input type="text" id="name" name="name" placeholder="your name" required>
                </div>
                
                <div class="form-group">
                    <label for="email">email</label>
                    <input type="email" id="email" name="email" placeholder="your@email.com" required>
                </div>
                
                <div class="form-group">
                    <label for="project">details</label>
                    <textarea id="project" name="message" rows="5" placeholder="put details here" required></textarea>
                </div>
                
                <button type="submit" class="submit-btn">send message</button>
            </form>
            <div id="form-response"></div>
        </section>

        <footer>
            <p>© 2025 romplin-labs.</p>
        </footer>
    </div>

    <script>
        // Form will now submit directly to Formspree
    </script>
</body>
</html>
